<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weater App</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <body>
    <div class="container">
        <h1>Weather Forecast</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>
        
        <div id="currentWeather"></div>

        <div class="hourly-section">
            <h3 id="hourlyTitle">Today's Hourly Forecast</h3>
            <div class="hourly-controls">
                <button id="todayBtn" class="hourly-btn active">Today</button>
            </div>
            <div id="hourlyDisplay"></div>
        </div>
        
        <div class="forecast-button">
            <button id="forecast5">5-Day Forecast</button>
        </div>
        
        <div id="forecastDisplay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
